[package]
# crates.io name (SPEC §4); the binary stays `canvas`.
name = "canvas-lms-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line client for Canvas LMS, for students"
keywords = ["canvas", "lms", "instructure", "cli", "student"]
categories = ["command-line-utilities"]
# crates.io publication waits on `canvas-api` and `canvas-core` becoming
# publishable; see docs/release.md.
publish = false

[[bin]]
name = "canvas"
path = "src/main.rs"

[lib]
name = "canvas_cli"
path = "src/lib.rs"

# `publish = false` would otherwise hide the binary from `dist`.
[package.metadata.dist]
dist = true

# `cargo binstall canvas-lms-cli` fetches the same archives `dist` uploads.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
anstream.workspace = true
anstyle.workspace = true
anyhow.workspace = true
canvas-api.workspace = true
canvas-core.workspace = true
clap.workspace = true
clap_complete.workspace = true
comfy-table.workspace = true
etcetera.workspace = true
figment.workspace = true
fs4.workspace = true
futures-util.workspace = true
indicatif.workspace = true
jiff.workspace = true
keyring.workspace = true
open.workspace = true
reqwest.workspace = true
rpassword = "=7.4.0"
rmcp.workspace = true
rusqlite.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "fs", "io-util", "sync", "time", "signal"] }
toml.workspace = true
tracing.workspace = true
uuid = { version = "=1.18.1", features = ["serde", "v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[dev-dependencies]
assert_cmd.workspace = true
canvas-core.workspace = true
insta = { workspace = true, features = ["json"] }
predicates.workspace = true
serde_json.workspace = true
tempfile = "=3.23.0"
tokio = { version = "=1.53.1", features = ["rt", "macros", "time", "sync", "test-util"] }
wiremock.workspace = true

[lints]
workspace = true
