[package]
name = "canvas-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line client for Canvas LMS"
publish = false

[[bin]]
name = "canvas"
path = "src/main.rs"

[dependencies]
anstream.workspace = true
anstyle.workspace = true
anyhow.workspace = true
canvas-api.workspace = true
canvas-core.workspace = true
clap.workspace = true
clap_complete.workspace = true
etcetera.workspace = true
figment.workspace = true
fs4.workspace = true
jiff.workspace = true
keyring.workspace = true
reqwest.workspace = true
rpassword = "=7.4.0"
open.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "fs", "io-util", "sync", "time"] }
toml.workspace = true
tracing.workspace = true
uuid = { version = "=1.18.1", features = ["serde", "v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile = "=3.23.0"
wiremock.workspace = true
serde_json.workspace = true
canvas-core.workspace = true
tokio = { version = "=1.53.1", features = ["rt", "macros", "time", "sync", "test-util"] }

[lints]
workspace = true
