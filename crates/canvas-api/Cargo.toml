[package]
name = "canvas-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Canvas LMS HTTP client, Secret, and models"

[dependencies]
futures-util.workspace = true
jiff.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
wiremock.workspace = true
# Workspace tokio omits test-util; pin the same version with test-util for paused-time tests.
tokio = { version = "=1.53.1", features = ["rt", "macros", "time", "sync", "io-util", "test-util"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[lints]
workspace = true
