[workspace]
members = ["cargo:."]

# SPEC §17. There is no Homebrew tap yet: this config is complete but nothing
# is published. See docs/release.md.
[dist]
cargo-dist-version = "0.32.0"
# Archives, checksums, and the Homebrew formula are all a release needs.
# No shell or powershell installer: those are direct archive downloads, and
# §17 rules those out on macOS until signing and notarization exist. Keeping
# them off for every platform means one documented install route per platform
# instead of an unsigned fallback users find first.
installers = ["homebrew"]
tap = "uguryildirim24/homebrew-tap"
formula = "canvas-lms-cli"
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
ci = ["github"]
# The release job only ever runs from a pushed tag; pull requests stop at
# `dist plan`.
pr-run-mode = "plan"
# No publish job. The tap does not exist yet, and dist 0.32 would push its own
# formula, which has no man page or completion install lines: `xtask
# dist-formula` adds those, and docs/release.md is the manual tap step. This is
# what `dist plan` warns about, and the warning is expected.
publish-jobs = []
install-updater = false
# `cargo xtask dist-assets` writes the first two before the archives are
# built. `skill` is tracked in the repository: it is the agent-facing
# documentation `canvas mcp` expects a host to load. `extension` is the
# browser companion, shipped unpacked because that is how Chrome loads it
# until it is published to the Web Store; it has no build step and no
# dependency, so the tracked directory is the artifact.
include = [
    "target/dist-assets/man",
    "target/dist-assets/completions",
    "skill",
    "extension",
]
# Injects the `dist-assets` step into the generated build job. This file is a
# fragment — a bare list of steps, not a workflow — so it lives outside
# `.github/workflows/`, where GitHub Actions would try to run it and fail.
github-build-setup = "../build-setup.yml"
