name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    name: gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.143,cargo-deny@0.20.2

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: test
        run: cargo nextest run --all-features

      - name: deny
        run: cargo deny check

      # The MSRV check shares this `target/` and can reuse nothing from the
      # gates above: a different rustc fingerprints every unit differently, so
      # the whole graph — aws-lc-sys included — is compiled a second time
      # alongside the first. On `ubuntu-latest` the two together fill the
      # runner's disk and the MSRV build dies linking with `No space left on
      # device`. Nothing after this point wants the gates' artifacts, and
      # cleaning them costs no rebuild that was not already going to happen.
      - name: drop the artifacts the gates are done with
        run: cargo clean

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"

      - name: msrv
        run: cargo +1.88 check --workspace --all-targets
